onospace">0-99</text><rect x="850.4" y="210.0" width="51.2" height="180.0" rx="3" fill="#8FA9A0"/><text x="876.0" y="204.0" text-anchor="middle" font-size="12" fill="#2C2C2A" font-family="Consolas, monospace">53</text><text x="876.0" y="408.0" text-anchor="middle" font-size="10.5" fill="#A89F8C" font-family="Consolas, monospace">100-199</text><rect x="930.4" y="250.8" width="51.2" height="139.2" rx="3" fill="#C9A227"/><text x="956.0" y="244.8" text-anchor="middle" font-size="12" fill="#2C2C2A" font-family="Consolas, monospace">41</text><text x="956.0" y="408.0" text-anchor="middle" font-size="10.5" fill="#A89F8C" font-family="Consolas, monospace">200-299</text><rect x="1010.4" y="328.9" width="51.2" height="61.1" rx="3" fill="#C9A227"/><text x="1036.0" y="322.9" text-anchor="middle" font-size="12" fill="#2C2C2A" font-family="Consolas, monospace">18</text><text x="1036.0" y="408.0" text-anchor="middle" font-size="10.5" fill="#A89F8C" font-family="Consolas, monospace">300-399</text><rect x="1090.4" y="339.1" width="51.2" height="50.9" rx="3" fill="#8C2F24"/><text x="1116.0" y="333.1" text-anchor="middle" font-size="12" fill="#2C2C2A" font-family="Consolas, monospace">15</text><text x="1116.0" y="408.0" text-anchor="middle" font-size="10.5" fill="#A89F8C" font-family="Consolas, monospace">400-499</text><rect x="1170.4" y="379.8" width="51.2" height="10.2" rx="3" fill="#8C2F24"/><text x="1196.0" y="373.8" text-anchor="middle" font-size="12" fill="#2C2C2A" font-family="Consolas, monospace">3</text><text x="1196.0" y="408.0" text-anchor="middle" font-size="10.5" fill="#A89F8C" font-family="Consolas, monospace">500-699</text><rect x="1250.4" y="379.8" width="51.2" height="10.2" rx="3" fill="#8C2F24"/><text x="1276.0" y="373.8" text-anchor="middle" font-size="12" fill="#2C2C2A" font-family="Consolas, monospace">3</text><text x="1276.0" y="408.0" text-anchor="middle" font-size="10.5" fill="#A89F8C" font-family="Consolas, monospace">700+</text><line x1="756" y1="390" x2="1316